name: App check

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-check.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-and-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35'
      - name: Run shared tests and build the Android demo
        working-directory: app
        run: ./gradlew --no-daemon --max-workers=2 :composeApp:desktopTest :composeApp:assembleDebug
