name: iOS morning runtime verification

on:
  push:
    branches: [test/morning-family-care-runtime]

permissions:
  contents: read

concurrency:
  group: ios-morning-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build the Kotlin simulator framework
        timeout-minutes: 20
        working-directory: app
        run: |
          xcodebuild -version
          ./gradlew --max-workers=1 --console=plain --info --stacktrace \
            :composeApp:linkDebugFrameworkIosSimulatorArm64
      - name: Choose a fresh iPhone simulator
        id: simulator
        timeout-minutes: 5
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          xcrun simctl list devices available -j > "$RUNNER_TEMP/family-care-devices.json"
          simulator=$(python3 - "$RUNNER_TEMP/family-care-devices.json" "$sdk" <<'PY'
          import json
          import sys
          from pathlib import Path

          devices = json.loads(Path(sys.argv[1]).read_text())["devices"]
          sdk_version = tuple(map(int, sys.argv[2].split(".")))[:2]
          candidates = []
          for runtime, simulator_devices in devices.items():
              if ".iOS-" not in runtime:
                  continue
              version = tuple(map(int, runtime.split(".iOS-")[1].split("-")))
              if version[:2] != sdk_version:
                  continue
              for device in simulator_devices:
                  if device["name"].startswith("iPhone") and device["isAvailable"]:
                      preferred_model = device["name"] == "iPhone 17 Pro"
                      candidates.append((version, preferred_model, device["udid"]))
          if not candidates:
              raise SystemExit(f"The runner has no available iPhone simulator for iOS {sys.argv[2]}")
          print(max(candidates)[2])
          PY
          )
          echo "id=$simulator" >> "$GITHUB_OUTPUT"
          xcrun simctl bootstatus "$simulator" -b
      - name: Build the app and XCTest runner
        timeout-minutes: 10
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project app/iosApp/FamilyCare.xcodeproj -scheme FamilyCare \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/family-care-derived" \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Walk through the synthetic family demo
        timeout-minutes: 8
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          xcodebuild -project app/iosApp/FamilyCare.xcodeproj -scheme FamilyCare \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/family-care-derived" \
            -resultBundlePath "$RUNNER_TEMP/family-care-ui.xcresult" \
            -parallel-testing-enabled NO -collect-test-diagnostics never \
            -only-testing:FamilyCareUITests/FamilyCareSmokeTests/testHackathonDemo \
            CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Export synthetic demo screenshots
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/family-care-ui.xcresult/Info.plist"; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/family-care-ui.xcresult" \
              --output-path "$RUNNER_TEMP/family-care-attached-screens"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-care-morning-ios-evidence
          path: ${{ runner.temp }}/family-care-attached-screens
          if-no-files-found: ignore
          retention-days: 3
